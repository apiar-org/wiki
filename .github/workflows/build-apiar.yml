# Build the patched image we run at docs.apiar.cloud.
#
# Upstream's own `build.yml` publishes every push to `scarlett` as the next beta, to Docker Hub and
# GHCR, for amd64 and arm64. This builds one named tag from a patch branch instead: no Crowdin upload
# (that needs a token and pushes translations upstream), no Docker Hub, and amd64 only, which is what
# the host runs. Everything else - the asset and block builds the Dockerfile copies in, the image
# itself - is upstream's.
#
# The tag is the upstream beta this branch is based on plus our patch revision, and it is pinned in
# Apiar.Cloud `ansible/files/wiki/docker-compose.yml`. Never `latest`.
name: Build + Publish (Apiar)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag, e.g. 3.0.0-beta.583-apiar1'
        required: true
        default: '3.0.0-beta.583-apiar3'
      version:
        description: 'The upstream version this branch is based on'
        required: true
        default: '3.0.0-beta.583'
  push:
    branches:
      - 'apiar/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Set Build Variables
        run: |
          echo "REL_VERSION=${{ inputs.version || '3.0.0-beta.583' }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ inputs.tag || '3.0.0-beta.583-apiar3' }}" >> $GITHUB_ENV

      - name: Set Version
        run: |
          yq -iP '.version = strenv(REL_VERSION)' backend/package.json -o json
          yq -iP '.version = strenv(REL_VERSION)' frontend/package.json -o json

      - name: Build Assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Blocks
        working-directory: blocks
        run: |
          npm ci
          npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dev/build/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.title=Wiki.js (Apiar patch)
            org.opencontainers.image.description=Wiki.js ${{ env.REL_VERSION }} with the storage import and render-drop fixes
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
