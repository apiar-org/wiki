key: puppeteer
title: Puppeteer
description: >-
  Headless Chromium browser. Required to re-render a page from its source on the server: the markdown
  renderer lives in the browser, so the server drives one. Installing it downloads a Chromium build of
  a few hundred megabytes, unless the server already provides one through PUPPETEER_EXECUTABLE_PATH.
website: 'https://pptr.dev'
detect:
  type: module
  value: puppeteer
architectures:
  - x64
  - arm64
# Not a declared dependency of the backend, unlike Sharp: a browser is worth a few hundred megabytes
# only to an instance that renders pages on the server, so installing it is a decision rather than a
# default. That makes this a real first install and not merely a repair.
isInstallable: true
# The version installed, here rather than in `package.json` for the reason above. The Docker image
# reads this same line, so an image and a hand-installed instance agree on what Puppeteer is.
#
# It has to match the Chromium it drives. Puppeteer speaks the CDP of one Chrome build - its
# `PUPPETEER_REVISIONS.chrome` - and the image installs Debian's `chromium` package, which moves on its
# own. 25.4.0 names 151.0.7922.47; trixie now ships 154.0.8037.57, and that pair fails every render
# with `Requesting main frame too early!` from `page.goto`. 25.12.0 names 154.0.8037.57 exactly.
#
# Check `PUPPETEER_REVISIONS` against `chromium --version` in the image whenever either moves.
installVersion: 25.12.0
